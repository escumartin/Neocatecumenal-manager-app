services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neocatecumenal}
      POSTGRES_USER: ${POSTGRES_USER:-neocatecumenal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neocatecumenal}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neocatecumenal} -d ${POSTGRES_DB:-neocatecumenal}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres18-data:
