name: PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Claude token
        id: key
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not configured, skipping the automated review"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.key.outputs.available == 'true'
        with:
          fetch-depth: 0
      - name: Claude Code review (claude-code-action v1.0.286)
        if: steps.key.outputs.available == 'true'
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allow_fork_prs: "false"
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(git show:*),Bash(gh pr comment ${{ github.event.pull_request.number }} *)"
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}
            BASE: origin/${{ github.event.pull_request.base.ref }}

            Eres el orquestador de la revisión de esta PR. Solo lees: no apruebes la PR, no edites ficheros, no hagas commit ni push.

            1. Lista los ficheros tocados con `git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD` y lee el diff con `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`.
            2. Elige los revisores por las rutas tocadas. No lances subagentes: por cada revisor elegido, lee `.claude/agents/<revisor>.md` y aplica tú su rúbrica al diff, de uno en uno:
               - siempre `security-reviewer`;
               - `backend-reviewer` y `observability-reviewer`, si hay cambios en `backend/` (Java de producción para observability);
               - `frontend-reviewer`, si hay cambios en `app/`;
               - `architect`, si hay cambios en `api/` (contrato OpenAPI) o migraciones Flyway;
               - `docs-reviewer`, si hay cambios en `docs/`, `.agents/`, `AGENTS.md`, `specs/` o cualquier `.md`;
               - `tdd`, solo lectura, si hay código de producción sin su test.
               No lances `self-reviewer`, `critic`, `qa-backend` ni `build-resolver`.
            3. Quédate solo con hallazgos con ruta y línea que estén en el diff de la PR.
            4. Deja un único comentario resumen en castellano, con un hallazgo por línea con el formato `ruta:línea | severidad | mensaje` (severidad: bloqueante, alta, media o baja), ordenado de mayor a menor severidad. Primero una línea con los revisores aplicados. Sin hallazgos: «Sin hallazgos» y nada más. Publícalo con `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "<comentario>"`; es tu última acción y la revisión no termina sin él.
      - name: Fail on blocking or high findings
        if: steps.key.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          STARTED: ${{ steps.key.outputs.started }}
        run: |
          comment=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '[.[] | select(.user.login == "github-actions[bot]")] | last')
          updated=$(jq -r '.updated_at // empty' <<< "$comment")
          if [ -z "$updated" ] || [[ "$updated" < "$STARTED" ]]; then
            echo "::error::The review did not publish its summary comment"
            exit 1
          fi
          if jq -r '.body' <<< "$comment" | grep -qE '\| (bloqueante|alta) \|'; then
            echo "::error::The review found blocking or high severity findings"
            exit 1
          fi
