name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout (actions/checkout 4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Java (actions/setup-java 4.9.1)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B verify

  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (actions/checkout 4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node (actions/setup-node 4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: npx --yes @redocly/cli@2.76.0 lint api/openapi.yaml --config api/redocly.yaml

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout (actions/checkout 4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node (actions/setup-node 4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run api:check
      - run: npx expo export -p web

  publish:
    needs: [backend, contract, app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - name: Checkout (actions/checkout 4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Buildx (docker/setup-buildx-action 4.4.1)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build backend image (docker/build-push-action 7.4.0)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: backend
          build-contexts: |
            api=api
          build-args: |
            SERVICE_REVISION=${{ github.sha }}
          tags: neocatecumenal-backend:local
          load: true
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build web image (docker/build-push-action 7.4.0)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/edge/Dockerfile
          tags: neocatecumenal-web:local
          load: true
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Compose smoke test
        run: deploy/tests/smoke.sh
      - name: Log in to GHCR (docker/login-action 4.8.0)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish sha tags and then move production
        run: |
          for image in backend web; do
            repository="ghcr.io/escumartin/neocatecumenal-$image"
            docker tag "neocatecumenal-$image:local" "$repository:sha-$GITHUB_SHA"
            docker push "$repository:sha-$GITHUB_SHA"
          done
          for image in backend web; do
            repository="ghcr.io/escumartin/neocatecumenal-$image"
            docker tag "neocatecumenal-$image:local" "$repository:production"
            docker push "$repository:production"
          done
