worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  map $uri $uri_masked_1 {
    "~^(?<head>.*?)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?<tail>.*)$" "${head}:id${tail}";
    default $uri;
  }

  map $uri_masked_1 $uri_masked_2 {
    "~^(?<head>.*?)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?<tail>.*)$" "${head}:id${tail}";
    default $uri_masked_1;
  }

  map $uri_masked_2 $uri_masked_3 {
    "~^(?<head>.*?)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?<tail>.*)$" "${head}:id${tail}";
    default $uri_masked_2;
  }

  map $uri_masked_3 $uri_masked_4 {
    "~^(?<head>.*?)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?<tail>.*)$" "${head}:id${tail}";
    default $uri_masked_3;
  }

  map $uri_masked_4 $uri_masked_5 {
    "~^(?<head>.*?)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?<tail>.*)$" "${head}:id${tail}";
    default $uri_masked_4;
  }

  map $uri_masked_5 $uri_masked_6 {
    "~^(?<head>.*?)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?<tail>.*)$" "${head}:id${tail}";
    default $uri_masked_5;
  }

  map $uri_masked_6 $uri_masked_7 {
    "~^(?<head>.*?)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?<tail>.*)$" "${head}:id${tail}";
    default $uri_masked_6;
  }

  map $uri_masked_7 $uri_masked_8 {
    "~^(?<head>.*?)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?<tail>.*)$" "${head}:id${tail}";
    default $uri_masked_7;
  }

  map $uri_masked_8 $uri_masked {
    "~[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}" "-";
    default $uri_masked_8;
  }

  log_format minimal '$time_iso8601 $request_method $uri_masked $status $body_bytes_sent $request_time';
  access_log /dev/stdout minimal;

  resolver 127.0.0.11 valid=10s ipv6=off;

  set_real_ip_from 172.28.251.11;
  real_ip_header X-Forwarded-For;
  real_ip_recursive off;

  server {
    listen 8080 default_server;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location ^~ /actuator {
      return 404;
    }

    location ^~ /api/ {
      set $backend http://backend:8080;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Port "";
      proxy_hide_header Strict-Transport-Security;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Content-Security-Policy;
    }

    location ~ /\. {
      return 404;
    }

    location ~* "\.[a-z0-9]{1,10}$" {
      try_files $uri =404;
      expires -1;
    }

    location ^~ /_expo/static/ {
      try_files $uri =404;
      expires 1y;
    }

    location / {
      try_files $uri /index.html;
      expires -1;
    }
  }
}
