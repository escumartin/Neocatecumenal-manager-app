name: neocatecumenal

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

x-app-environment: &app-environment
  DATABASE_URL: jdbc:postgresql://postgres:5432/neocatecumenal
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS es obligatorio}
  PRIVACY_NOTICE_VERSION: ${PRIVACY_NOTICE_VERSION:?PRIVACY_NOTICE_VERSION es obligatorio}
  MINIMUM_APP_VERSION: ${MINIMUM_APP_VERSION:?MINIMUM_APP_VERSION es obligatorio}
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75

x-secrets-group: &secrets-group
  - ${NEOCAT_SECRETS_GID:?NEOCAT_SECRETS_GID es obligatorio}

x-app-secrets: &app-secrets
  - source: database_username
    target: spring.datasource.username
  - source: database_password
    target: spring.datasource.password

services:
  postgres:
    <<: *hardening
    image: postgres:18.7@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
    user: "999:999"
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: neocatecumenal
      POSTGRES_USER_FILE: /run/secrets/database_username
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    group_add: *secrets-group
    secrets:
      - source: database_username
      - source: database_password
    tmpfs:
      - /tmp
      - /run/postgresql
    volumes:
      - neocatecumenal-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$(cat /run/secrets/database_username)\" -d neocatecumenal"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging
    networks:
      - db-net

  backend:
    <<: *hardening
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE es obligatorio}
    restart: unless-stopped
    mem_limit: 768m
    environment:
      <<: *app-environment
      SPRING_PROFILES_ACTIVE: prod
    group_add: *secrets-group
    secrets: *app-secrets
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    networks:
      - db-net
      - edge-net

  edge:
    <<: *hardening
    image: ${WEB_IMAGE:?WEB_IMAGE es obligatorio}
    restart: unless-stopped
    mem_limit: 128m
    tmpfs:
      - /tmp
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging
    networks:
      edge-net:
        ipv4_address: 172.28.250.10
      tailscale-net:
        ipv4_address: 172.28.251.10

  tailscale:
    <<: *hardening
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    hostname: neocatecumenal
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_AUTHKEY: file:/run/secrets/tailscale_authkey
      TS_EXTRA_ARGS: --advertise-tags=tag:neocatecumenal
    group_add: *secrets-group
    secrets:
      - source: tailscale_authkey
    tmpfs:
      - /tmp
    volumes:
      - neocatecumenal-tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on:
      edge:
        condition: service_healthy
    logging: *logging
    networks:
      tailscale-net:
        ipv4_address: 172.28.251.11

  migrate:
    <<: *hardening
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE es obligatorio}
    profiles: [ops]
    restart: "no"
    mem_limit: 768m
    environment:
      <<: *app-environment
      SPRING_PROFILES_ACTIVE: prod,migrate
    group_add: *secrets-group
    secrets: *app-secrets
    tmpfs:
      - /tmp
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    networks:
      - db-net

  bootstrap:
    <<: *hardening
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE es obligatorio}
    profiles: [ops]
    restart: "no"
    mem_limit: 768m
    tty: true
    stdin_open: true
    environment:
      <<: *app-environment
      SPRING_PROFILES_ACTIVE: prod,bootstrap
      IDENTITY_BOOTSTRAP_ADMINISTRATORNAME: ${IDENTITY_BOOTSTRAP_ADMINISTRATORNAME:-}
      IDENTITY_BOOTSTRAP_ADMINISTRATORCOMMUNITY: ${IDENTITY_BOOTSTRAP_ADMINISTRATORCOMMUNITY:-}
    group_add: *secrets-group
    secrets: *app-secrets
    tmpfs:
      - /tmp
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: none
    networks:
      - db-net

networks:
  db-net:
    internal: true
  edge-net:
    internal: true
    ipam:
      config:
        - subnet: 172.28.250.0/24
  tailscale-net:
    ipam:
      config:
        - subnet: 172.28.251.0/24

volumes:
  neocatecumenal-pgdata:
    name: neocatecumenal-pgdata
  neocatecumenal-tailscale-state:
    name: neocatecumenal-tailscale-state

secrets:
  database_username:
    file: ${NEOCAT_HOME:?NEOCAT_HOME es obligatorio}/secrets/spring.datasource.username
  database_password:
    file: ${NEOCAT_HOME:?NEOCAT_HOME es obligatorio}/secrets/spring.datasource.password
  tailscale_authkey:
    file: ${NEOCAT_HOME:?NEOCAT_HOME es obligatorio}/secrets/tailscale.authkey
