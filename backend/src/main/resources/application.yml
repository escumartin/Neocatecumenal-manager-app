spring:
  application:
    name: neocatecumenal-manager
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    default-property-inclusion: non_null
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
server:
  forward-headers-strategy: none
service:
  minimum-app-version: 1.0.0
  revision: ${SERVICE_REVISION:0000000}
identity:
  privacy-notice-version: v1
  allowed-origins: []
  bootstrap:
    enabled: false
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
