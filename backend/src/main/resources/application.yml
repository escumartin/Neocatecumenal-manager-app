spring:
  application:
    name: neocatecumenal-manager
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/neocatecumenal}
    username: ${DATABASE_USER:neocatecumenal}
    password: ${DATABASE_PASSWORD:neocatecumenal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    default-property-inclusion: non_null
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
server:
  forward-headers-strategy: none
identity:
  privacy-notice-version: v1
  allowed-origins: []
  bootstrap:
    enabled: false
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
