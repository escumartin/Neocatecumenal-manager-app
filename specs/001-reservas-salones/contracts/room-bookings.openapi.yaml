openapi: 3.1.0
info:
  title: Neocatecumenal Manager API - Rooms, bookings and events (draft)
  version: 0.1.0-draft
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: rooms
  - name: booking-requests
  - name: events
paths:
  /api/rooms:
    get:
      tags: [rooms]
      operationId: listRooms
      summary: Active rooms that can be booked
      responses:
        "200":
          description: Active rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Create a bookable room (administrators only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "201":
          description: Room created and active
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/StateConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/rooms/{roomId}:
    put:
      tags: [rooms]
      operationId: renameRoom
      summary: Change the name of an active room (administrators only)
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "200":
          description: Room renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/rooms/{roomId}/deactivation:
    post:
      tags: [rooms]
      operationId: deactivateRoom
      summary: Permanently deactivate a room with no active bookings from today on (administrators only); history is kept
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: Room deactivated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The room still has active bookings from today on, or is already deactivated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RoomHasActiveBookingsProblem"
  /api/rooms/{roomId}/occupancy:
    get:
      tags: [rooms]
      operationId: getRoomOccupancy
      summary: Occupied slots of a room on a day, without reasons or personal data
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Occupied slots ordered by start time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomOccupancy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/booking-requests:
    post:
      tags: [booking-requests]
      operationId: createBookingRequest
      summary: Request a room for a slot, once or weekly until an end date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Request registered as pending
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The room is occupied on at least one date; nothing is registered
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RoomOccupiedProblem"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    get:
      tags: [booking-requests]
      operationId: listBookingRequests
      summary: Booking requests visible to the caller (own community for moderators, any for administrators)
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/BookingRequestStatus"
          style: form
          explode: true
        - name: communityId
          in: query
          description: Administrators only; ignored for moderators, who always get their own community
          schema:
            type: string
            format: uuid
        - name: roomId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Page of booking requests ordered by first date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequestPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/booking-requests/{bookingRequestId}:
    get:
      tags: [booking-requests]
      operationId: getBookingRequest
      summary: Booking request with its occurrences and status history
      parameters:
        - $ref: "#/components/parameters/BookingRequestId"
      responses:
        "200":
          description: Booking request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/booking-requests/{bookingRequestId}/approval:
    post:
      tags: [booking-requests]
      operationId: approveBookingRequest
      summary: Approve a pending request (administrators only); a series is approved as a whole
      parameters:
        - $ref: "#/components/parameters/BookingRequestId"
      responses:
        "200":
          description: Request approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
  /api/booking-requests/{bookingRequestId}/rejection:
    post:
      tags: [booking-requests]
      operationId: rejectBookingRequest
      summary: Reject a pending request with an optional reason (administrators only)
      parameters:
        - $ref: "#/components/parameters/BookingRequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectBookingRequest"
      responses:
        "200":
          description: Request rejected; its slots are free again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/booking-requests/{bookingRequestId}/cancellation:
    post:
      tags: [booking-requests]
      operationId: cancelBookingRequest
      summary: Cancel a request or a whole series; future occurrences are cancelled, past ones are kept
      parameters:
        - $ref: "#/components/parameters/BookingRequestId"
      responses:
        "200":
          description: Request cancelled; its future slots are free again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
  /api/booking-requests/{bookingRequestId}/bookings/{bookingId}/cancellation:
    post:
      tags: [booking-requests]
      operationId: cancelBooking
      summary: Cancel a single occurrence of a series
      parameters:
        - $ref: "#/components/parameters/BookingRequestId"
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Occurrence cancelled; the rest of the series is unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
  /api/events:
    post:
      tags: [events]
      operationId: createEvent
      summary: Create a one-day event in a room; its booking request is created in the same operation or nothing is saved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvent"
      responses:
        "201":
          description: Event and its pending booking request registered
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The room is occupied; neither the event nor the booking request is saved
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RoomOccupiedProblem"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/events/{eventId}:
    get:
      tags: [events]
      operationId: getEvent
      summary: Event with the status of its booking request
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookingRequestId:
      name: bookingRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The caller's role or community does not allow this action
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Room, request or occurrence not found or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StateConflict:
      description: The request is no longer in a state that allows this action, for example already resolved by another administrator
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: Invalid input; nothing is registered
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
  schemas:
    LocalTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      examples:
        - "18:00"
    TimeSlot:
      type: object
      required: [startTime, endTime]
      properties:
        startTime:
          $ref: "#/components/schemas/LocalTime"
        endTime:
          $ref: "#/components/schemas/LocalTime"
    Room:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
        active:
          type: boolean
    RoomInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    EventType:
      type: string
      enum: [WORD, CONVIVENCE]
    CreateEvent:
      type: object
      required: [type, title, roomId, date, startTime, endTime]
      properties:
        type:
          $ref: "#/components/schemas/EventType"
        title:
          type: string
          minLength: 1
          maxLength: 120
        communityId:
          type: string
          format: uuid
          description: Required for administrators; moderators may omit it or must send their own community
        roomId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        startTime:
          $ref: "#/components/schemas/LocalTime"
        endTime:
          $ref: "#/components/schemas/LocalTime"
    Event:
      type: object
      required: [id, type, title, communityId, roomId, date, startTime, endTime, bookingRequestId, bookingStatus]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/EventType"
        title:
          type: string
        communityId:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        startTime:
          $ref: "#/components/schemas/LocalTime"
        endTime:
          $ref: "#/components/schemas/LocalTime"
        bookingRequestId:
          type: string
          format: uuid
        bookingStatus:
          $ref: "#/components/schemas/BookingRequestStatus"
    OccupiedSlot:
      allOf:
        - $ref: "#/components/schemas/TimeSlot"
        - type: object
          required: [status, ownCommunity]
          properties:
            status:
              type: string
              enum: [PENDING, APPROVED]
            ownCommunity:
              type: boolean
    RoomOccupancy:
      type: object
      required: [roomId, date, occupied]
      properties:
        roomId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        occupied:
          type: array
          items:
            $ref: "#/components/schemas/OccupiedSlot"
    WeeklyRecurrence:
      type: object
      required: [frequency, until]
      properties:
        frequency:
          type: string
          enum: [WEEKLY]
        until:
          type: string
          format: date
          description: Last possible date, inclusive; at most one year after the first date
    CreateBookingRequest:
      type: object
      required: [roomId, date, startTime, endTime, reason]
      properties:
        roomId:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
          description: Required for administrators; moderators may omit it or must send their own community
        date:
          type: string
          format: date
        startTime:
          $ref: "#/components/schemas/LocalTime"
        endTime:
          $ref: "#/components/schemas/LocalTime"
        reason:
          type: string
          minLength: 1
          maxLength: 200
        recurrence:
          $ref: "#/components/schemas/WeeklyRecurrence"
    RejectBookingRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    BookingRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]
    BookingStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]
    BookingRequest:
      type: object
      required: [id, roomId, communityId, date, startTime, endTime, reason, status, occurrenceCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        startTime:
          $ref: "#/components/schemas/LocalTime"
        endTime:
          $ref: "#/components/schemas/LocalTime"
        reason:
          type: string
        recurrence:
          $ref: "#/components/schemas/WeeklyRecurrence"
        status:
          $ref: "#/components/schemas/BookingRequestStatus"
        rejectionReason:
          type: string
        occurrenceCount:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    Booking:
      type: object
      required: [id, date, startTime, endTime, status]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        startTime:
          $ref: "#/components/schemas/LocalTime"
        endTime:
          $ref: "#/components/schemas/LocalTime"
        status:
          $ref: "#/components/schemas/BookingStatus"
    StatusChange:
      type: object
      required: [toStatus, changedBy, changedAt]
      properties:
        bookingId:
          type: string
          format: uuid
        fromStatus:
          type: string
          enum: [PENDING, APPROVED, REJECTED, CANCELLED]
        toStatus:
          type: string
          enum: [PENDING, APPROVED, REJECTED, CANCELLED]
        changedBy:
          type: string
          format: uuid
        changedAt:
          type: string
          format: date-time
    BookingRequestDetail:
      allOf:
        - $ref: "#/components/schemas/BookingRequest"
        - type: object
          required: [bookings, history]
          properties:
            bookings:
              type: array
              items:
                $ref: "#/components/schemas/Booking"
            history:
              type: array
              items:
                $ref: "#/components/schemas/StatusChange"
    BookingRequestPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BookingRequest"
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Stable error code the client maps to a localised message
          enum:
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - VALIDATION_FAILED
            - ROOM_OCCUPIED
            - BOOKING_REQUEST_ALREADY_RESOLVED
            - BOOKING_REQUEST_NOT_ACTIVE
            - BOOKING_IN_THE_PAST
            - ROOM_NAME_TAKEN
            - ROOM_INACTIVE
            - ROOM_HAS_ACTIVE_BOOKINGS
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, code]
                properties:
                  field:
                    type: string
                  code:
                    type: string
                    enum:
                      - REQUIRED
                      - END_NOT_AFTER_START
                      - DATE_IN_THE_PAST
                      - RECURRENCE_UNTIL_BEFORE_DATE
                      - RECURRENCE_TOO_LONG
                      - TOO_LONG
                      - COMMUNITY_REQUIRED
                      - ROOM_INACTIVE
                      - INVALID_EVENT_TYPE
    RoomOccupiedProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [conflicts]
          properties:
            conflicts:
              type: array
              items:
                type: object
                required: [date, startTime, endTime]
                properties:
                  date:
                    type: string
                    format: date
                  startTime:
                    $ref: "#/components/schemas/LocalTime"
                  endTime:
                    $ref: "#/components/schemas/LocalTime"
    RoomHasActiveBookingsProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            activeBookings:
              type: integer
              minimum: 1
