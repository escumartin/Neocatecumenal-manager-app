openapi: 3.1.0
info:
  title: Neocatecumenal Manager API
  version: 0.2.0
servers:
  - url: /
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: sessions
    description: Log in and log out
  - name: me
    description: Own profile, password and privacy notice
  - name: users
    description: User management
  - name: communities
    description: Communities
  - name: rooms
    description: Parish rooms and their occupancy
  - name: booking-requests
    description: Room booking requests and series
  - name: events
    description: Minimal agenda, one-day events in a room
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Service health
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/sessions:
    post:
      tags: [sessions]
      operationId: logIn
      summary: Log in with access id and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: Session created; pendingSteps tells the client what must be done before using the app
          headers:
            Set-Cookie:
              description: Session cookie, only when tokenDelivery is COOKIE
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Unknown access id or wrong password; same response for both
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/LoginBlocked"
  /api/sessions/current:
    delete:
      tags: [sessions]
      operationId: logOut
      summary: Close the current session
      responses:
        "204":
          description: Session closed; the session cookie is cleared if present
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Current user and every identity datum stored about them
      description: Allowed with pending steps
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/me/password:
    put:
      tags: [me]
      operationId: changeMyPassword
      summary: Change own password; closes every other session of the user
      description: Allowed with the PASSWORD_CHANGE pending step once the privacy notice is accepted. The fifth consecutive wrong current password closes every session of the user and answers 401
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Password changed; the current session stays open
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/me/privacy-notice-acceptance:
    post:
      tags: [me]
      operationId: acceptPrivacyNotice
      summary: Record acceptance of the current privacy notice version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyNoticeAcceptance"
      responses:
        "204":
          description: Acceptance recorded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"
  /api/me/privacy-notice-rejection:
    post:
      tags: [me]
      operationId: rejectPrivacyNotice
      summary: Reject the privacy notice; the current session is closed and any recorded acceptance is withdrawn
      responses:
        "204":
          description: Session closed; the notice is shown again on the next login
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/communities:
    get:
      tags: [communities]
      operationId: listCommunities
      summary: Read-only list of communities ordered by number
      responses:
        "200":
          description: Communities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Community"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Users of a community (moderators see only their own; administrators must pass communityId)
      parameters:
        - name: communityId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Page of users ordered by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user; the system generates the access id and the initial password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created; the initial password is shown only in this response
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getUser
      summary: One user visible to the caller
      description: A moderator asking for a user of another community gets 403; 404 only when the user does not exist
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    put:
      tags: [users]
      operationId: updateUser
      summary: Replace name, role and community; moderators may only change the name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "200":
          description: User updated; a role or community change applies on the user's next request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user permanently; the client asks for confirmation first
      responses:
        "204":
          description: User deleted; every session is closed and UserDeleted is published
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
  /api/users/{userId}/password-reset:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [users]
      operationId: resetUserPassword
      summary: Assign a new generated initial password; closes every session of the user
      responses:
        "200":
          description: New initial password, shown only in this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitialPassword"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
  /api/rooms:
    get:
      tags: [rooms]
      operationId: listRooms
      summary: Active rooms that can be booked
      responses:
        "200":
          description: Active rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Create a bookable room (administrators only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "201":
          description: Room created and active
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/BookingStateConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/rooms/{roomId}:
    put:
      tags: [rooms]
      operationId: renameRoom
      summary: Change the name of an active room (administrators only)
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "200":
          description: Room renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"
        "409":
          $ref: "#/components/responses/BookingStateConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/rooms/{roomId}/deactivation:
    post:
      tags: [rooms]
      operationId: deactivateRoom
      summary: Permanently deactivate a room with no pending or approved bookings with a future slot (administrators only); history is kept
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: Room deactivated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"
        "409":
          description: The room still has pending or approved bookings with a future slot, or is already deactivated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RoomHasActiveBookingsProblem"
  /api/rooms/{roomId}/occupancy:
    get:
      tags: [rooms]
      operationId: getRoomOccupancy
      summary: Occupied slots of a room on a day, without reasons or personal data
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: communityId
          in: query
          description: Community the caller acts for, used for ownCommunity; required for administrators (422 COMMUNITY_REQUIRED), moderators may omit it or send their own (another community gets 403)
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Occupied slots ordered by start time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomOccupancy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/booking-requests:
    post:
      tags: [booking-requests]
      operationId: createBookingRequest
      summary: Request a room for a slot, once or weekly until an end date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Request registered as pending
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"
        "409":
          description: ROOM_OCCUPIED with the conflicting dates, or ROOM_INACTIVE; nothing is registered
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RoomOccupiedProblem"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    get:
      tags: [booking-requests]
      operationId: listBookingRequests
      summary: Booking requests visible to the caller (own community for moderators, any for administrators)
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/BookingRequestStatus"
          style: form
          explode: true
        - name: communityId
          in: query
          description: Administrators may filter by community or omit it to see all; moderators may omit it or send their own (another community gets 403)
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Page of booking requests ordered by first date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequestPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/booking-requests/{bookingRequestId}:
    get:
      tags: [booking-requests]
      operationId: getBookingRequest
      summary: Booking request with its occurrences and status history (moderators only for their community)
      parameters:
        - $ref: "#/components/parameters/BookingRequestId"
      responses:
        "200":
          description: Booking request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"
  /api/booking-requests/{bookingRequestId}/reason:
    put:
      tags: [booking-requests]
      operationId: rectifyBookingRequestReason
      summary: Correct the reason of a pending request (moderator of its community or administrator)
      parameters:
        - $ref: "#/components/parameters/BookingRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingReasonInput"
      responses:
        "200":
          description: Reason corrected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"
        "409":
          $ref: "#/components/responses/BookingStateConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/booking-requests/{bookingRequestId}/approval:
    post:
      tags: [booking-requests]
      operationId: approveBookingRequest
      summary: Approve a pending request whose first occurrence has not started (administrators only); a series is approved as a whole
      parameters:
        - $ref: "#/components/parameters/BookingRequestId"
      responses:
        "200":
          description: Request approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"
        "409":
          $ref: "#/components/responses/BookingStateConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/booking-requests/{bookingRequestId}/rejection:
    post:
      tags: [booking-requests]
      operationId: rejectBookingRequest
      summary: Reject a pending request with an optional reason (administrators only)
      parameters:
        - $ref: "#/components/parameters/BookingRequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectBookingRequest"
      responses:
        "200":
          description: Request rejected; its slots are free again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"
        "409":
          $ref: "#/components/responses/BookingStateConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/booking-requests/{bookingRequestId}/cancellation:
    post:
      tags: [booking-requests]
      operationId: cancelBookingRequest
      summary: Cancel a request or a whole series; occurrences not yet started are cancelled, past and started ones are kept
      parameters:
        - $ref: "#/components/parameters/BookingRequestId"
      responses:
        "200":
          description: Request cancelled; its future slots are free again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"
        "409":
          $ref: "#/components/responses/BookingStateConflict"
  /api/booking-requests/{bookingRequestId}/bookings/{bookingId}/cancellation:
    post:
      tags: [booking-requests]
      operationId: cancelBooking
      summary: Cancel a single occurrence that has not started yet
      parameters:
        - $ref: "#/components/parameters/BookingRequestId"
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Occurrence cancelled; the rest of the series is unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingRequestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"
        "409":
          $ref: "#/components/responses/BookingStateConflict"
  /api/events:
    post:
      tags: [events]
      operationId: createEvent
      summary: Create a one-day event in a room; its booking request is created in the same operation or nothing is saved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvent"
      responses:
        "201":
          description: Event and its pending booking request registered
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"
        "409":
          description: ROOM_OCCUPIED with the conflicting dates, or ROOM_INACTIVE; neither the event nor the booking request is saved
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RoomOccupiedProblem"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/events/{eventId}:
    get:
      tags: [events]
      operationId: getEvent
      summary: Event with the status of its booking request (moderators only for their community)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token, native client
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-session
      description: Same opaque session token in an HttpOnly, Secure, SameSite=Strict cookie, web client
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookingRequestId:
      name: bookingRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Not authenticated, session expired or user deleted
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Role, community or pending first-access steps do not allow this action; a moderator acting on a user of another community always gets 403
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: User does not exist
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StateConflict:
      description: The change would break an invariant or the user changed concurrently
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: Invalid input; nothing is changed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
    LoginBlocked:
      description: Too many failed attempts from this origin
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/LoginBlockedProblem"
    BookingNotFound:
      description: Room, booking request, occurrence or event does not exist
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BookingStateConflict:
      description: >-
        The request or room is no longer in a state that allows this action; codes BOOKING_REQUEST_ALREADY_RESOLVED
        (already resolved or changed concurrently), BOOKING_REQUEST_NOT_ACTIVE, BOOKING_ALREADY_STARTED, ROOM_NAME_TAKEN
        or ROOM_INACTIVE
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          examples:
            - UP
    AccessId:
      type: integer
      minimum: 100000
      maximum: 999999
      examples:
        - 482913
    Password:
      type: string
      minLength: 1
      maxLength: 256
      writeOnly: true
      description: Length policy (8 to 64 code points) is checked by the server and reported as a validation code
    Role:
      type: string
      enum: [REGISTERED, MODERATOR, ADMINISTRATOR]
    PendingStep:
      type: string
      enum: [PRIVACY_NOTICE, PASSWORD_CHANGE]
    LoginRequest:
      type: object
      required: [accessId, password]
      properties:
        accessId:
          $ref: "#/components/schemas/AccessId"
        password:
          $ref: "#/components/schemas/Password"
        tokenDelivery:
          type: string
          enum: [BODY, COOKIE]
          default: BODY
    LoginResponse:
      type: object
      required: [me]
      properties:
        token:
          type: string
          description: Present only when tokenDelivery is BODY
        me:
          $ref: "#/components/schemas/Me"
    Me:
      type: object
      required: [userId, accessId, name, role, communityId, communityNumber, pendingSteps, currentPrivacyNoticeVersion]
      properties:
        userId:
          type: string
          format: uuid
        accessId:
          $ref: "#/components/schemas/AccessId"
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        communityId:
          type: string
          format: uuid
        communityNumber:
          type: integer
        pendingSteps:
          type: array
          items:
            $ref: "#/components/schemas/PendingStep"
        currentPrivacyNoticeVersion:
          type: string
        privacyNoticeAcceptance:
          $ref: "#/components/schemas/PrivacyNoticeAcceptanceRecord"
    PrivacyNoticeAcceptanceRecord:
      type: object
      required: [version, acceptedAt]
      properties:
        version:
          type: string
        acceptedAt:
          type: string
          format: date-time
    PrivacyNoticeAcceptance:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: Must equal currentPrivacyNoticeVersion; otherwise 409 PRIVACY_NOTICE_OUTDATED
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          $ref: "#/components/schemas/Password"
        newPassword:
          $ref: "#/components/schemas/Password"
    Community:
      type: object
      required: [id, number]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
    UserInput:
      type: object
      required: [name, role, communityId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: "#/components/schemas/Role"
        communityId:
          type: string
          format: uuid
    User:
      type: object
      required: [id, accessId, name, role, communityId, passwordChangePending]
      properties:
        id:
          type: string
          format: uuid
        accessId:
          $ref: "#/components/schemas/AccessId"
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        communityId:
          type: string
          format: uuid
        passwordChangePending:
          type: boolean
    CreatedUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [initialPassword]
          properties:
            initialPassword:
              type: string
    InitialPassword:
      type: object
      required: [initialPassword]
      properties:
        initialPassword:
          type: string
    UserPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Stable error code the client maps to a localised message
          enum:
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - VALIDATION_FAILED
            - INVALID_CREDENTIALS
            - LOGIN_TEMPORARILY_BLOCKED
            - PRIVACY_NOTICE_PENDING
            - PRIVACY_NOTICE_OUTDATED
            - PASSWORD_CHANGE_REQUIRED
            - LAST_ADMINISTRATOR
            - LAST_MODERATOR
            - SELF_ACTION_FORBIDDEN
            - CONCURRENT_MODIFICATION
            - BAD_REQUEST
            - METHOD_NOT_ALLOWED
            - NOT_ACCEPTABLE
            - UNSUPPORTED_MEDIA_TYPE
            - INTERNAL_ERROR
            - ROOM_OCCUPIED
            - BOOKING_REQUEST_ALREADY_RESOLVED
            - BOOKING_REQUEST_NOT_ACTIVE
            - BOOKING_ALREADY_STARTED
            - ROOM_NAME_TAKEN
            - ROOM_INACTIVE
            - ROOM_HAS_ACTIVE_BOOKINGS
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, code]
                properties:
                  field:
                    type: string
                  code:
                    type: string
                    enum:
                      - REQUIRED
                      - TOO_LONG
                      - INVALID_FORMAT
                      - COMMUNITY_REQUIRED
                      - COMMUNITY_NOT_FOUND
                      - PASSWORD_TOO_SHORT
                      - PASSWORD_TOO_LONG
                      - PASSWORD_TOO_COMMON
                      - PASSWORD_CONTAINS_ACCESS_ID
                      - CURRENT_PASSWORD_INCORRECT
                      - END_NOT_AFTER_START
                      - START_NOT_IN_FUTURE
                      - RECURRENCE_UNTIL_BEFORE_DATE
                      - RECURRENCE_TOO_LONG
    LoginBlockedProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [retryAfterSeconds]
          properties:
            retryAfterSeconds:
              type: integer
              minimum: 1

    LocalTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      examples:
        - "18:00"
    TimeSlot:
      type: object
      required: [startTime, endTime]
      properties:
        startTime:
          $ref: "#/components/schemas/LocalTime"
        endTime:
          $ref: "#/components/schemas/LocalTime"
    Room:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
        active:
          type: boolean
    RoomInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    EventType:
      type: string
      enum: [WORD, CONVIVENCE]
    CreateEvent:
      type: object
      required: [type, title, roomId, date, startTime, endTime]
      properties:
        type:
          $ref: "#/components/schemas/EventType"
        title:
          type: string
          minLength: 1
          maxLength: 120
        communityId:
          type: string
          format: uuid
          description: Community the caller acts for; required for administrators (422 COMMUNITY_REQUIRED, or COMMUNITY_NOT_FOUND), moderators may omit it or send their own (another community gets 403)
        roomId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        startTime:
          $ref: "#/components/schemas/LocalTime"
        endTime:
          $ref: "#/components/schemas/LocalTime"
    Event:
      type: object
      required: [id, type, title, communityId, roomId, date, startTime, endTime, bookingRequestId, bookingStatus]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/EventType"
        title:
          type: string
        communityId:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        startTime:
          $ref: "#/components/schemas/LocalTime"
        endTime:
          $ref: "#/components/schemas/LocalTime"
        bookingRequestId:
          type: string
          format: uuid
        bookingStatus:
          $ref: "#/components/schemas/BookingRequestStatus"
    OccupiedSlot:
      allOf:
        - $ref: "#/components/schemas/TimeSlot"
        - type: object
          required: [status, ownCommunity]
          properties:
            status:
              type: string
              enum: [PENDING, APPROVED]
            ownCommunity:
              type: boolean
    RoomOccupancy:
      type: object
      required: [roomId, date, occupied]
      properties:
        roomId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        occupied:
          type: array
          items:
            $ref: "#/components/schemas/OccupiedSlot"
    WeeklyRecurrence:
      type: object
      required: [frequency, until]
      properties:
        frequency:
          type: string
          enum: [WEEKLY]
        until:
          type: string
          format: date
          description: Mandatory last possible date, inclusive; not before the first date and at most one year after it
    CreateBookingRequest:
      type: object
      required: [roomId, date, startTime, endTime, reason]
      properties:
        roomId:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
          description: Community the caller acts for; required for administrators (422 COMMUNITY_REQUIRED, or COMMUNITY_NOT_FOUND), moderators may omit it or send their own (another community gets 403)
        date:
          type: string
          format: date
        startTime:
          $ref: "#/components/schemas/LocalTime"
        endTime:
          $ref: "#/components/schemas/LocalTime"
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Shown to administrators; the form warns not to include personal data
        recurrence:
          $ref: "#/components/schemas/WeeklyRecurrence"
    RejectBookingRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Optional; the form warns not to include personal data
    BookingReasonInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    BookingRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]
    BookingStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]
    BookingRequest:
      type: object
      required: [id, roomId, communityId, date, startTime, endTime, reason, status, occurrenceCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        startTime:
          $ref: "#/components/schemas/LocalTime"
        endTime:
          $ref: "#/components/schemas/LocalTime"
        reason:
          type: string
        recurrence:
          $ref: "#/components/schemas/WeeklyRecurrence"
        status:
          $ref: "#/components/schemas/BookingRequestStatus"
        rejectionReason:
          type: string
        occurrenceCount:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    Booking:
      type: object
      required: [id, date, startTime, endTime, status]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        startTime:
          $ref: "#/components/schemas/LocalTime"
        endTime:
          $ref: "#/components/schemas/LocalTime"
        status:
          $ref: "#/components/schemas/BookingStatus"
    StatusChange:
      type: object
      required: [toStatus, changedAt]
      properties:
        bookingId:
          type: string
          format: uuid
        fromStatus:
          type: string
          enum: [PENDING, APPROVED, REJECTED, CANCELLED]
        toStatus:
          type: string
          enum: [PENDING, APPROVED, REJECTED, CANCELLED]
        changedBy:
          type: string
          format: uuid
          description: Absent when the user was deleted; the client shows a deleted-user label
        changedAt:
          type: string
          format: date-time
    BookingRequestDetail:
      allOf:
        - $ref: "#/components/schemas/BookingRequest"
        - type: object
          required: [bookings, history]
          properties:
            bookings:
              type: array
              items:
                $ref: "#/components/schemas/Booking"
            history:
              type: array
              items:
                $ref: "#/components/schemas/StatusChange"
    BookingRequestPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BookingRequest"
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
    RoomOccupiedProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            conflicts:
              type: array
              description: Present with code ROOM_OCCUPIED; empty when another request took the slot concurrently and the client must reload the occupancy
              items:
                type: object
                required: [date, startTime, endTime]
                properties:
                  date:
                    type: string
                    format: date
                  startTime:
                    $ref: "#/components/schemas/LocalTime"
                  endTime:
                    $ref: "#/components/schemas/LocalTime"
    RoomHasActiveBookingsProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            activeBookings:
              type: integer
              minimum: 1
