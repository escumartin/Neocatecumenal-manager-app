openapi: 3.1.0
info:
  title: Neocatecumenal Manager API
  version: 0.0.1
servers:
  - url: /
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Service health
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          examples:
            - UP
